<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 차 · 바로카</title>
<meta name="theme-color" content="#13214A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="baroka_icon_192.png">
<link rel="apple-touch-icon" href="baroka_icon_192.png">
<link rel="stylesheet" href="baroka.css?v=20261109">
<script src="baroka_i18n.js?v=20261105"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="bk-shell">
  <aside class="bk-rail"><div class="bk-ads" data-n="5"></div></aside>
  <main class="bk-main">
    <header class="bk-top">
      <a class="bk-back" href="index.html" aria-label="처음 화면">‹</a>
      <h1 class="bk-h1">내 차</h1>
      <button class="bk-pill bk-hide" id="out" type="button">로그아웃</button>
    </header>

    <div class="bk-msg" id="msg"></div>

    <!-- 로그인 전 -->
    <section class="bk-card bk-hide" id="auth">
      <h2 id="authTtl">차를 등록하려면 계정이 필요해요</h2>
      <p class="bk-sub">닉네임과 비밀번호만 정하면 됩니다. 전화번호 · 이메일은 받지 않아요.<br>에일리어스콜 계정이 있으면 그대로 들어오세요.</p>
      <div class="bk-row" role="tablist">
        <button class="bk-btn sm" id="tNew" type="button">처음이에요</button>
        <button class="bk-btn ghost sm" id="tOld" type="button">계정이 있어요</button>
      </div>
      <div><label class="bk-lbl" for="nick">닉네임</label><input class="bk-in" id="nick" autocomplete="username" maxlength="20" placeholder="예) 하늘차주"></div>
      <div><label class="bk-lbl" for="pw">비밀번호</label><input class="bk-in" id="pw" type="password" autocomplete="new-password" placeholder="6자리 이상"></div>
      <div class="bk-msg info" id="pwNote" style="display:block">⚠ 비밀번호를 잊으면 찾을 수 없어요. 꼭 적어 두세요.</div>
      <button class="bk-btn blue" id="authGo" type="button">가입하고 시작하기</button>
    </section>

    <!-- 로그인 뒤 -->
    <section class="bk-hide" id="me" style="display:flex;flex-direction:column;gap:14px">
      <a class="bk-btn" href="inbox.html" id="inboxBtn">📨 받은 연락 보기<span class="dot" id="dot" style="position:static;margin-left:4px"></span></a>
      <a class="bk-btn ghost" href="gallery.html?mine=1">🚘 내 갤러리 · 차 자랑하기 <span class="bk-tag" style="margin-left:4px">4칸 무료</span></a>
      <div id="cars" style="display:flex;flex-direction:column;gap:12px"></div>
      <div id="others"></div>
      <section class="bk-card">
        <div style="display:flex;align-items:center;justify-content:space-between"><h2 id="addTtl">내 차 등록하기</h2><span class="bk-tag y">월 요금 없음</span></div>
        <div class="bk-price"><b id="pReg">2,500원</b><span>한 번 내면 끝 · 차 바꿀 때까지</span></div>
        <p class="bk-sub" id="creditNote"></p>
        <button class="bk-btn blue" id="addBtn" type="button">＋ 차 등록하기</button>
      </section>
      <div class="bk-ads-h bk-ads-inline"><span>광고</span></div>
      <div class="bk-ads bk-ads-inline" data-n="2"></div>
      <label class="bk-card" style="flex-direction:row;align-items:center;gap:12px;cursor:pointer">
        <span style="flex:1"><b>앱을 열면 바로 번호판 카메라</b><br><span class="bk-sub">끄면 찾기 화면만 열려요</span></span>
        <input type="checkbox" id="lsOn" style="width:26px;height:26px">
      </label>
      <!-- 🔴 2026-11-09 유치대리점: 추천 대리점 코드 넣기(가입 후 30일 안) -->
      <section class="bk-card" id="prBox" style="display:none"></section>
      <p class="bk-foot"><span id="who"></span><br>번호판을 바꾸면 번호 변경 <b id="pChg">2,500원</b> · 차를 팔거나 폐차하면 무료로 지울 수 있어요.</p>
      <!-- 🔴 2026-11-05 — 회원 탈퇴(앱 스토어 · 플레이 필수: 앱 안에서 계정을 지울 수 있어야 함) -->
      <button type="button" id="delAcc" style="align-self:center;background:none;border:none;color:var(--bk-sub,#888);font:inherit;font-size:13.5px;text-decoration:underline;cursor:pointer;padding:8px">회원 탈퇴 (계정 지우기)</button>
    </section>
  </main>
  <aside class="bk-rail"><div class="bk-ads" data-n="5"></div></aside>
</div>

<script src="baroka.js?v=20261109"></script>
<script src="aliascall_web_pay.js"></script>
<script src="aliascall_store.js"></script>
<script src="aliascall_parking_plate.js?v=20261112d"></script>
<script src="aliascall_qr_sticker.js?v=20261112d"></script>
<script src="baroka_partner_ref.js?v=20261109"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var PEND = 'baroka_pending';           // 결제하러 간 사이 기억해 둘 것 {kind:'reg'|'change', plate, make, color, reg}
  var ST = null, mode = 'new';
  function say(t, kind){ var m = $('msg'); m.className = 'bk-msg on ' + (kind || 'info'); m.textContent = t; m.scrollIntoView({ block: 'nearest' }); }
  function hush(){ $('msg').className = 'bk-msg'; }
  function won(n){ return Number(n || 0).toLocaleString('ko-KR') + '원'; }
  function pendGet(){ try { return JSON.parse(localStorage.getItem(PEND) || 'null'); } catch (e) { return null; } }
  function pendSet(o){ try { o ? localStorage.setItem(PEND, JSON.stringify(o)) : localStorage.removeItem(PEND); } catch (e) {} }
  var ERR = { no_credit: '결제가 아직 확인되지 않았어요. 잠시 뒤 다시 열어 주세요.', bad_plate: '번호판 모양이 아니에요. 예) 12가 3456, 123나 4567',
              not_mine: '내 차가 아니에요.', same: '지금 번호와 같아요.', login: '다시 로그인해 주세요.', not_vehicle: '차량 등록이 아니에요.' };

  /* ── 로그인 ── */
  function authMode(m){
    mode = m;
    $('tNew').className = 'bk-btn sm' + (m === 'new' ? '' : ' ghost');
    $('tOld').className = 'bk-btn sm' + (m === 'old' ? '' : ' ghost');
    $('authGo').textContent = m === 'new' ? '가입하고 시작하기' : '로그인';
    $('pwNote').style.display = m === 'new' ? 'block' : 'none';
    $('pw').setAttribute('autocomplete', m === 'new' ? 'new-password' : 'current-password');
  }
  $('tNew').onclick = function(){ authMode('new'); };
  $('tOld').onclick = function(){ authMode('old'); };
  $('authGo').onclick = async function(){
    hush(); var b = this; b.disabled = true;
    try {
      var r = mode === 'new' ? await BK.signup($('nick').value, $('pw').value) : await BK.login($('nick').value, $('pw').value);
      if (!r.ok) { say(r.error, 'bad'); return; }
      await load();
    } finally { b.disabled = false; }
  };
  $('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('authGo').click(); });
  $('out').onclick = async function(){ await BK.logout(); location.reload(); };
  /* 🔴 2026-11-05 — 회원 탈퇴: 에일리어스콜과 같은 탈퇴 기능(self-delete-account)을 씁니다. 차 · 갤러리 · 남은 등록권이 함께 지워집니다. */
  $('delAcc').onclick = function(){
    var EN = document.documentElement.lang === 'en', W = EN ? 'DELETE' : '탈퇴';
    var sh = BK.sheet('<h2>회원 탈퇴</h2>' +
      '<p class="bk-sub">등록한 차, 차 갤러리 사진, 쓰지 않은 등록권 · 변경권이 모두 지워지고 되돌릴 수 없어요. 남은 등록권은 환불되지 않습니다.</p>' +
      '<label class="bk-lbl" for="dW">확인을 위해 <b>' + W + '</b> 라고 적어 주세요</label><input class="bk-in" id="dW" autocomplete="off">' +
      '<div class="bk-msg" id="dMsg"></div>' +
      '<button class="bk-btn" id="dGo" type="button" style="background:#D6336C;color:#fff">탈퇴하기</button><button class="bk-btn ghost" id="dNo" type="button">취소</button>');
    sh.el.querySelector('#dNo').onclick = sh.close;
    sh.el.querySelector('#dGo').onclick = async function(){
      var m = sh.el.querySelector('#dMsg'), b = this;
      if (sh.el.querySelector('#dW').value.trim().toUpperCase() !== W) { m.textContent = W + ' 라고 적어 주세요.'; m.className = 'bk-msg err'; m.style.display = 'block'; return; }
      b.disabled = true;
      try {
        var s = (await BK.sb.auth.getSession()).data.session;
        var r = await fetch(BK.URL + '/functions/v1/self-delete-account', { method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + s.access_token }, body: JSON.stringify({ reason: 'baroka' }) });
        var d = await r.json().catch(function(){ return {}; });
        if (!r.ok) throw new Error(d.error || r.status);
        await BK.logout(); alert('탈퇴했습니다. 그동안 바로카를 써 주셔서 고맙습니다.'); location.href = 'index.html';
      } catch (e) { m.textContent = '탈퇴하지 못했어요: ' + e.message; m.className = 'bk-msg err'; m.style.display = 'block'; b.disabled = false; }
    };
  };

  /* ── 상태 ── */
  async function load(){
    var u = await BK.user();
    $('auth').classList.toggle('bk-hide', !!u);
    $('me').classList.toggle('bk-hide', !u);
    $('out').classList.toggle('bk-hide', !u);
    if (!u) { authMode(new URLSearchParams(location.search).get('login') ? 'old' : 'new'); return; }
    var r = await BK.sb.rpc('baroka_state');
    if (r.error || !r.data || !r.data.ok) { say('불러오지 못했어요. ' + ((r.error && r.error.message) || ''), 'bad'); return; }
    ST = r.data;
    $('who').textContent = (ST.nickname || '') + ' 님으로 로그인됨';
    try { if (window.PartnerRef) PartnerRef.mount($('prBox')); } catch (e) {}
    $('pReg').textContent = won(ST.price_reg); $('pChg').textContent = won(ST.price_change);
    $('addTtl').textContent = ST.cars.length ? '차 한 대 더 등록하기' : '내 차 등록하기';
    var notes = [];
    if (ST.reg_credits) notes.push('🎟 쓰지 않은 등록권 ' + ST.reg_credits + '장 — 결제 없이 바로 등록돼요.');
    if (ST.change_credits) notes.push('🎟 쓰지 않은 번호 변경권 ' + ST.change_credits + '장');
    $('creditNote').textContent = notes.join('\n'); $('creditNote').style.whiteSpace = 'pre-line';
    $('addBtn').textContent = ST.reg_credits ? '＋ 등록권으로 바로 등록' : '＋ 차 등록하기 · ' + won(ST.price_reg);
    drawCars();
    BK.unread($('dot'));
    await resume();
  }

  function drawCars(){
    $('cars').innerHTML = ST.cars.map(function(c){
      var meta = [c.make, c.color].filter(Boolean).join(' · ');
      return '<div class="bk-mycar" data-id="' + c.id + '">' +
        '<div class="hd"><label class="bk-plate small" style="flex:1"><span class="band"></span><input readonly value="' + BK.esc(BK.plateNice(c.plate)) + '" aria-label="차 번호"></label></div>' +
        '<div class="meta">' + (meta ? BK.esc(meta) + ' · ' : '') + new Date(c.created_at).toLocaleDateString('ko-KR') + ' 등록' + (c.changes ? ' · 번호 변경 ' + c.changes + '번' : '') + '</div>' +
        (c.dup ? '<div class="bk-msg bad on" style="font-size:13px">같은 번호로 등록한 분이 또 있어요. 차를 산 분이라면 그대로 쓰셔도 되고, 이상하면 문의해 주세요.</div>' : '') +
        '<div class="bk-acts">' +
          '<button type="button" data-a="print">🔺 대시보드 알림판</button>' +
          '<button type="button" data-a="qr">🏷 QR 스티커</button>' +
          '<button type="button" data-a="change">🔁 번호 바꿨어요</button>' +
          '<button type="button" data-a="remove">🗑 차를 팔았어요</button>' +
        '</div></div>';
    }).join('');
    $('cars').querySelectorAll('[data-a]').forEach(function(b){
      var id = b.closest('[data-id]').getAttribute('data-id');
      var car = ST.cars.find(function(c){ return c.id === id; });
      b.onclick = function(){ ({ print: doPrint, qr: doQr, change: doChange, remove: doRemove })[b.getAttribute('data-a')](car); };
    });
    $('others').innerHTML = (ST.other_cars || []).length ? '<section class="bk-card"><h2>에일리어스콜에 등록한 차</h2>' +
      '<p class="bk-sub">바로카로 옮기면 월 요금 없이 전화 · 문자를 계속 받아요. 등록권 1장(' + won(ST.price_reg) + ')이 필요해요.</p>' +
      ST.other_cars.map(function(o){ return '<button class="bk-btn ghost sm" type="button" data-move="' + o.id + '">' + BK.esc(BK.plateNice(o.plate)) + ' — 바로카로 옮기기</button>'; }).join('') +
      '</section>' : '';
    $('others').querySelectorAll('[data-move]').forEach(function(b){
      b.onclick = function(){ startReg({ move: b.getAttribute('data-move') }); };
    });
  }

  /* ── 등록 ── */
  $('addBtn').onclick = function(){ startReg({}); };
  function startReg(pre){
    if (pre.move) return payOr({ kind: 'reg', move: pre.move });
    var s = BK.sheet(
      '<h3>내 차 등록하기</h3>' +
      '<label class="bk-lbl">차 번호</label><label class="bk-plate small"><span class="band"></span><input id="rPlate" maxlength="14" placeholder="12가 3456"></label>' +
      '<div class="bk-row"><div><label class="bk-lbl" for="rMake">차종 (선택)</label><input class="bk-in" id="rMake" maxlength="20" placeholder="예) 아반떼"></div>' +
      '<div><label class="bk-lbl" for="rColor">색 (선택)</label><input class="bk-in" id="rColor" maxlength="10" placeholder="예) 흰색"></div></div>' +
      '<label style="display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5"><input type="checkbox" id="rOk" style="width:22px;height:22px;flex:none;margin-top:1px">' +
      '<span>제 차(또는 제가 쓰는 차)가 맞고, <a href="terms.html" target="_blank">이용약관</a>과 <a href="privacy.html" target="_blank">개인정보처리방침</a>에 동의합니다.</span></label>' +
      '<div class="bk-msg" id="rMsg"></div>' +
      '<button class="bk-btn blue" id="rGo" type="button">' + (ST.reg_credits ? '등록권으로 등록하기' : won(ST.price_reg) + ' 결제하고 등록하기') + '</button>' +
      '<p class="bk-sub" style="text-align:center">월 요금 없음 · 차를 팔거나 폐차하면 무료로 지울 수 있어요</p>');
    var pi = s.el.querySelector('#rPlate'); setTimeout(function(){ pi.focus(); }, 50);
    pi.addEventListener('blur', function(){ if (BK.plateOk(pi.value)) pi.value = BK.plateNice(pi.value); });
    s.el.querySelector('#rGo').onclick = function(){
      var m = s.el.querySelector('#rMsg');
      var plate = pi.value.trim();
      if (!BK.plateOk(plate)) { m.className = 'bk-msg on bad'; m.textContent = ERR.bad_plate; return; }
      if (!s.el.querySelector('#rOk').checked) { m.className = 'bk-msg on bad'; m.textContent = '확인란에 체크해 주세요.'; return; }
      s.close();
      payOr({ kind: 'reg', plate: BK.plateNice(plate), make: s.el.querySelector('#rMake').value.trim(), color: s.el.querySelector('#rColor').value.trim() });
    };
  }

  /* 권이 있으면 바로, 없으면 결제 */
  async function payOr(job){
    var have = job.kind === 'reg' ? ST.reg_credits : ST.change_credits;
    if (have) return finish(job);
    pendSet(job);
    var sku = job.kind === 'reg' ? 'baroka_reg' : 'baroka_change';
    if (window.ACStore && ACStore.inApp()) {
      ACStore.onDone = async function(r){
        if (r.ok) { await load(); }
        else if (!r.canceled) say('결제를 마치지 못했어요. ' + (r.error || ''), 'bad');
        else pendSet(null);
      };
      ACStore.buy(sku, {});
      return;
    }
    var ok = await ACWeb.inicis(BK.sb, sku, { plate: job.plate || '', reg: job.reg || job.move || '' }, { buyername: ST.nickname || '회원' });
    if (!ok) pendSet(null);
  }

  /* 결제 뒤 · 권으로 마무리 */
  async function finish(job){
    hush();
    try {
      if (job.kind === 'reg') {
        var regId = job.move;
        if (!regId) {
          var c = await BK.sb.rpc('create_registration_full', {
            p_category: 'vehicle', p_country_code: 'KR', p_title: (ST.nickname || '') + '님의 차', p_description: null,
            p_search_key: job.plate, p_guest_password: null,
            p_detail: { plate_number: job.plate, make: job.make || null, color: job.color || null } });
          if (c.error) throw c.error;
          regId = c.data && c.data.id;
        }
        var r = await BK.sb.rpc('baroka_claim', { p_reg: regId });
        if (r.error || !r.data.ok) {
          if (!job.move && regId) { try { await BK.sb.from('registrations').delete().eq('id', regId); } catch (e) {} }
          throw new Error(ERR[r.data && r.data.error] || (r.error && r.error.message) || '등록하지 못했어요');
        }
        pendSet(null);
        await load();
        say('✅ 등록되었어요! 이제 이 번호로 연락을 받을 수 있어요.\n주차 안내판을 뽑아 앞유리에 두면 더 좋아요.', 'ok');
      } else {
        var x = await BK.sb.rpc('baroka_change_plate', { p_reg: job.reg, p_plate: job.plate });
        if (x.error || !x.data.ok) throw new Error(ERR[x.data && x.data.error] || (x.error && x.error.message) || '바꾸지 못했어요');
        pendSet(null);
        await load();
        say('✅ 번호를 ' + job.plate + ' 로 바꿨어요. 주차 안내판의 QR은 그대로 쓰시면 됩니다.', 'ok');
      }
    } catch (e) {
      console.error(e); say(String(e.message || e), 'bad');
    }
  }

  /* 결제하고 돌아왔을 때 이어서 */
  async function resume(){
    var q = new URLSearchParams(location.search);
    if (q.get('webpaid') === '0') { say('결제를 마치지 못했어요. ' + (q.get('msg') || ''), 'bad'); pendSet(null); }
    if (q.has('webpaid') || q.has('new')) history.replaceState(null, '', 'my.html');
    var job = pendGet();
    if (job) {
      var have = job.kind === 'reg' ? ST.reg_credits : ST.change_credits;
      if (have) { await finish(job); return; }
      if (q.get('webpaid') === '1') say('결제는 되었어요. 확인 중이니 잠시 뒤 이 화면을 다시 열어 주세요.');
    }
    if (q.has('new') && !ST.cars.length) startReg({});
  }

  /* ── 차 한 대에 할 일 ── */
  function doPrint(car){ ParkingPlate.print({ token: car.token }); }
  function doQr(car){
    var link = BK.SITE + '/connect.html?t=' + car.token;
    var s = BK.sheet('<h3>' + BK.esc(BK.plateNice(car.plate)) + ' 의 QR 스티커</h3><p class="bk-sub">이 QR을 찍으면 번호 없이 저에게 연락이 와요. 그대로 뽑아 차에 붙이세요.</p>' +
      '<img id="qrSt" alt="QR 스티커" style="align-self:center;width:100%;max-width:300px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.15)">' +
      '<div class="bk-row"><button class="bk-btn ghost sm" id="qCopy" type="button">링크 복사</button><button class="bk-btn ghost sm" id="qSave" type="button">스티커 저장</button><button class="bk-btn sm" id="qPrint" type="button">🖨 인쇄</button></div>' +
      '<a href="https://www.coupang.com/vp/products/8626482812?vendorItemId=92033809085" target="_blank" rel="noopener" class="bk-sub" style="text-align:center;display:block;font-weight:700">🛡 투명 보호필름(6.5 × 6.5cm) 구매 — 붙이면 방수 · 붙이기 쉬움 ›</a>');
    var url = qrSticker(link);
    if (url) s.el.querySelector('#qrSt').src = url;
    s.el.querySelector('#qCopy').onclick = async function(){ try { await navigator.clipboard.writeText(link); BK.toast('복사했어요'); } catch (e) { prompt('복사해 주세요', link); } };
    s.el.querySelector('#qSave').onclick = function(){
      if (!url) return;
      var a = document.createElement('a'); a.href = url; a.download = 'baroka_qr_' + BK.plateKey(car.plate) + '.png'; a.click();
    };
    s.el.querySelector('#qPrint').onclick = function(){ if (url) printSticker(url); };
  }
  /* 「통화를 원하시면 QR코드를 스캔하세요」 스티커 — 보라 테두리 · 아래 안내 3줄 */
  var ST_TOP = '통화를 원하시면 QR코드를 스캔하세요';
  var ST_BOT = ['QR인식이 안될 경우 앱스토어에서 가림콜을 다운받아', '설치후 차량번호로 검색하시면 바로 통화가 됩니다.', '(또는  garimcall.com에 접속 후 차번호를 입력하세요)'];
  function qrSticker(link){
    if (typeof QRCode === 'undefined') { BK.toast('QR을 만들지 못했어요. 잠시 뒤 다시 눌러 주세요.'); return ''; }
    var tmp = document.createElement('div'); tmp.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(tmp);
    new QRCode(tmp, { text: link, width: 800, height: 800, correctLevel: QRCode.CorrectLevel.M });
    var qc = tmp.querySelector('canvas'); document.body.removeChild(tmp);
    if (!qc) return '';
    var W = 1200, H = 1200, P = '#6a3d9a', c = document.createElement('canvas'); c.width = W; c.height = H;
    var g = c.getContext('2d'), F = '"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    function rr(x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
    function fit(t, size, max, w){ g.font = w + ' ' + size + 'px ' + F; while (g.measureText(t).width > max && size > 10) { size -= 1; g.font = w + ' ' + size + 'px ' + F; } }
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
    rr(20, 20, W - 40, H - 40, 40); g.fillStyle = '#ecebe7'; g.fill(); g.lineWidth = 3; g.strokeStyle = '#d6d4cf'; g.stroke();
    g.fillStyle = P; g.textAlign = 'center'; g.textBaseline = 'middle';
    fit(ST_TOP, 66, W - 160, '900'); g.fillText(ST_TOP, W / 2, 100);
    // 보라 테두리: 위 · 양옆은 이어지고, 아래는 양 끝만(글자 자리 비움)
    var L = 120, R = W - 120, T = 160, B = 1072, gapL = 165, gapR = W - 165;
    g.lineWidth = 20; g.strokeStyle = P; g.lineJoin = 'miter'; g.lineCap = 'butt';
    g.beginPath(); g.moveTo(gapL, B); g.lineTo(L, B); g.lineTo(L, T); g.lineTo(R, T); g.lineTo(R, B); g.lineTo(gapR, B); g.stroke();
    g.fillStyle = '#ffffff'; g.fillRect(215, 195, W - 430, W - 430);
    g.imageSmoothingEnabled = false; g.drawImage(qc, 240, 220, W - 480, W - 480);
    g.fillStyle = P;
    for (var i = 0; i < ST_BOT.length; i++) { fit(ST_BOT[i], 44, W - 350, '800'); g.fillText(ST_BOT[i], W / 2, 1014 + i * 58); }
    return c.toDataURL('image/png');
  }
  function printSticker(url){
    var st = document.getElementById('stCss');
    if (!st) { st = document.createElement('style'); st.id = 'stCss';
      st.textContent = '#stArea{display:none}@media print{@page{size:A4;margin:12mm}body.st-printing>*{display:none!important}body.st-printing>#stArea{display:block!important}#stArea .g{display:grid;grid-template-columns:60mm 60mm;gap:14mm;justify-content:center;margin-top:20mm}#stArea img{width:60mm;height:60mm;display:block;outline:0.2mm dashed #bbb;outline-offset:2mm}#stArea p{font:12px sans-serif;text-align:center;color:#666;margin-top:12mm}}';
      document.head.appendChild(st); }
    var area = document.getElementById('stArea');
    if (!area) { area = document.createElement('div'); area.id = 'stArea'; document.body.appendChild(area); }
    area.innerHTML = '<div class="g">' + new Array(5).join('<img src="' + url + '">') + '</div><p>6 × 6cm 스티커 4장입니다. 점선을 따라 잘라 차 앞유리 안쪽에 붙이세요.<br>※ 투명 보호필름(6.5 × 6.5cm, 쿠팡에서 「표준형6.0x6.0cm」 검색)을 덧붙이면 비에 젖지 않고 유리창에 붙이기 쉽습니다.</p>';
    /* 🔴 2026-11-12 — 휴대폰 브라우저(삼성 인터넷 · 크롬)는 인쇄 미리보기를 만들기 전에 afterprint 가 먼저 와서
       표시를 지우면 빈 PDF 가 나왔습니다. 이제는 인쇄 화면에서 돌아와 화면을 다시 누를 때만 지웁니다(@media print 에서만 쓰여 화면엔 영향 없음). */
    document.body.classList.remove('pl-printing');
    document.body.classList.add('st-printing');
    var done = function(){ document.body.classList.remove('st-printing'); };
    setTimeout(function(){ document.addEventListener('pointerdown', done, { once: true }); }, 4000);
    setTimeout(function(){
      try { window.ACTheme && ACTheme.printLight && ACTheme.printLight(); } catch (e) {}
      if (window.AliasNative && typeof AliasNative.printPage === 'function') AliasNative.printPage('Baroka QR sticker');
      else window.print();
    }, 300);
  }
  function doChange(car){
    var s = BK.sheet('<h3>번호판을 바꾸셨나요?</h3>' +
      '<p class="bk-sub">새 번호로 바꾸면 그 번호로 연락을 받아요. 주차 안내판의 QR은 그대로 쓰시면 돼요.<br>번호 변경 ' + won(ST.price_change) + (ST.change_credits ? ' — 변경권이 있어 결제 없이 바뀝니다.' : '') + '</p>' +
      '<label class="bk-lbl">지금 번호</label><div class="bk-plate small"><span class="band"></span><input readonly value="' + BK.esc(BK.plateNice(car.plate)) + '"></div>' +
      '<label class="bk-lbl">새 번호</label><label class="bk-plate small"><span class="band"></span><input id="cPlate" maxlength="14" placeholder="123가 4567"></label>' +
      '<div class="bk-msg" id="cMsg"></div>' +
      '<button class="bk-btn blue" id="cGo" type="button">' + (ST.change_credits ? '변경권으로 바꾸기' : won(ST.price_change) + ' 결제하고 바꾸기') + '</button>' +
      '<p class="bk-sub" style="text-align:center">차를 팔았거나 다른 차로 바꿨다면 [🗑 차를 팔았어요] 후 새 차를 등록해 주세요.</p>');
    var pi = s.el.querySelector('#cPlate'); setTimeout(function(){ pi.focus(); }, 50);
    s.el.querySelector('#cGo').onclick = function(){
      var m = s.el.querySelector('#cMsg');
      if (!BK.plateOk(pi.value)) { m.className = 'bk-msg on bad'; m.textContent = ERR.bad_plate; return; }
      if (BK.plateKey(pi.value) === BK.plateKey(car.plate)) { m.className = 'bk-msg on bad'; m.textContent = ERR.same; return; }
      s.close();
      payOr({ kind: 'change', reg: car.id, plate: BK.plateNice(pi.value) });
    };
  }
  function doRemove(car){
    var s = BK.sheet('<h3>' + BK.esc(BK.plateNice(car.plate)) + ' 를 지울까요?</h3>' +
      '<p class="bk-sub">지우면 이 번호 · QR로 더 이상 연락이 오지 않아요. 되돌릴 수 없고, 다시 쓰려면 새로 등록(' + won(ST.price_reg) + ')해야 해요.</p>' +
      '<div class="bk-acts" id="why">' +
        ['차를 팔았어요', '폐차 · 말소했어요', '다른 차로 바꿨어요', '그냥 그만 쓸래요'].map(function(w){ return '<button type="button" data-w="' + w + '">' + w + '</button>'; }).join('') +
      '</div><button class="bk-btn ghost" type="button" id="rmNo">취소</button>');
    s.el.querySelector('#rmNo').onclick = s.close;
    s.el.querySelectorAll('[data-w]').forEach(function(b){
      b.onclick = async function(){
        b.disabled = true;
        var r = await BK.sb.rpc('baroka_remove', { p_reg: car.id, p_reason: b.getAttribute('data-w') });
        s.close();
        if (r.error || !r.data.ok) { say('지우지 못했어요. ' + ((r.error && r.error.message) || ERR[r.data && r.data.error] || ''), 'bad'); return; }
        await load(); say('지웠어요. 그동안 바로카를 써 주셔서 고맙습니다.', 'ok');
      };
    });
  }

  $('lsOn').checked = BK.launchScan();
  $('lsOn').onchange = function(){ BK.launchScan(this.checked); BK.toast(this.checked ? '앱을 열면 카메라가 바로 켜져요' : '앱을 열면 찾기 화면만 열려요'); };
  BK.ads(Array.prototype.slice.call(document.querySelectorAll('.bk-ads')));
  load();
})();
</script>
