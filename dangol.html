function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function toast(t){ var e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function(){ e.classList.remove('on'); }, 3000); }
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function token(){
  var t = store('dangol_token');
  if (!t || t.length < 24) {
    var a = new Uint8Array(20); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach(function(_, i){ a[i] = Math.random() * 256; });
    t = Array.prototype.map.call(a, function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');

}
function when(t){ var d = new Date(t); var k = new Date(d.getTime() + 9 * 3600e3); return (k.getUTCMonth() + 1) + '/' + k.getUTCDate() + ' ' + String(k.getUTCHours()).padStart(2, '0') + ':' + String(k.getUTCMinutes()).padStart(2, '0'); }
function photoUrl(p){ return p ? URL0 + '/storage/v1/object/public/dangol/' + p.split('/').map(encodeURIComponent).join('/') : ''; }
/* 계좌번호 · 링크가 보이면 경고 (링크는 누를 수 없게 글자로만 보여 줍니다) */
function risky(t){ t = String(t || ''); return /(https?:\/\/|www\.|[a-z0-9-]+\.(com|co\.kr|kr|net|io|me|ly|link|page|site)\b)/i.test(t) || /\d{2,6}[- ]\d{2,6}[- ]\d{2,8}/.test(t) || /\d{11,16}/.test(t.replace(/[- ]/g, '')) && /계좌|입금|송금|이체|은행/.test(t) || /계좌|입금해|송금해|이체해/.test(t); }
var WARN = '⚠ 계좌번호 · 링크가 들어 있어요. 돈을 보내기 전에 꼭 가게에 직접 확인하세요. 이상하면 아래 「신고하기」를 눌러 주세요.';
async function rpc(fn, args){ var r = await sb.rpc(fn, args || {}); if (r.error) throw r.error; return r.data; }
var ERR = { not_found: '가게를 찾지 못했어요. 코드를 다시 확인해 주세요.', suspended: '지금은 문의를 받을 수 없는 가게입니다.', paused: '이 가게 단골창구는 잠시 쉬는 중입니다.',

function errMsg(e){ var c = (e && (e.error || e.message)) || ''; return ERR[c] || (/dg_|function|schema/.test(c) ? '단골창구를 준비 중입니다. 잠시 후 다시 열어 주세요.' : '잠시 문제가 있었어요. 다시 해 주세요.'); }

async function hub(){
  document.title = '단골창구';

    '<div><span class="tag">🏪 단골창구</span><h1>가게에 바로 물어보세요</h1><p>전화번호 없이' + (DGHOST ? '' : ' · 앱 설치 없이') + '. 가게 QR을 찍거나, 아래에서 가게 이름으로 찾아보세요.</p></div></div>' +
    '<div class="card"><b class="h">🔎 가게 찾기</b><p>가게 이름(일부만 넣어도 돼요)이나 포스터의 6자리 코드를 넣으세요. 동네를 함께 넣으면 더 잘 찾아요. 예) 칼국수 권선</p>' +
      '<form class="row" id="sf" autocomplete="off"><input id="code" type="search" maxlength="40" placeholder="가게 이름 또는 코드" style="font-size:17px;flex:1;min-width:0" aria-label="가게 이름 또는 코드"><button class="btn" id="go" type="submit" style="flex:none;padding:0 20px">찾기</button></form>' +

    (DGHOST ? '' :   /* dangol.org 는 첫 화면에서 사장님 · 고객님을 나눠 고르므로, 고객님 화면에는 사장님 안내를 넣지 않습니다 */
    '<div class="card"><b class="h">🧑‍🍳 사장님이신가요?</b>' +

  var sT = null, sN = 0;

       (d.address ? mapRow(d) : '') + '</div>';

    h += '<div class="card"><b class="h">🙋 자주 묻는 질문</b>' + (d.greeting ? '<p class="pre-wrap">' + esc(d.greeting) + '</p>' : '') +
      (items.length > 3 ? '<input id="fq" type="search" placeholder="예) 주차 · 예약 · 포장" aria-label="찾을 말">' : '') + '<div id="faq" style="display:flex;flex-direction:column;gap:7px"></div></div>';
  }
  h += '<div id="thread"></div>' +
    '<div class="card" id="askCard"><b class="h">💬 사장님께 묻기</b><p>전화번호는 필요 없어요. 사장님이 답하면 이 화면과 「단골창구 입구 → 내가 물어본 가게」에서 보입니다.</p>' +
      '<input id="nm" maxlength="20" placeholder="부를 이름 (선택 · 예: 3번 테이블, 김OO)" aria-label="부를 이름">' +
      '<textarea id="body" maxlength="1000" placeholder="예) 오늘 저녁 6시에 4명 자리 있을까요?" aria-label="물어볼 내용"></textarea>' +
      '<button class="btn c" id="send" type="button">보내기</button></div>' +
    '<div style="text-align:center"><button class="link" id="report" type="button">🚩 이 가게 신고하기</button></div>' +
    '<p class="foot"><a href="dangol.html" style="color:inherit">단골창구 입구</a> · ' + (DGHOST ? '단골창구 · dangol.org' : '단골창구 by 가림콜') + '</p>';
  A.innerHTML = h;
  if (items.length) faq(items, '');
  var fq = $('fq'); if (fq) fq.oninput = function(){ faq(items, fq.value.trim()); };
  try { $('nm').value = store('dangol_name') || ''; } catch (e) {}
  $('send').onclick = send;
  $('report').onclick = report;
  if ($('cpAddr')) $('cpAddr').onclick = function(){ var t = d.address + (d.address_detail ? ' ' + d.address_detail : ''); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ toast('주소를 복사했어요. 내비에 붙여 넣으세요.'); }, function(){ toast(t); }); };
  await loadThread(Q.get('t'));
}
function grams(t){ var o = {}; String(t || '').toLowerCase().replace(/[^0-9a-z가-힣]+/g, ' ').split(' ').forEach(function(w){ if (w.length === 1) o[w] = 1; for (var i = 0; i < w.length - 1; i++) o[w.substr(i, 2)] = 1; }); return o; }
var STOP = ['어떻','떻게','하나','나요','해요','하는','어요','세요','니다','궁금','있나','는데','되나','있어','알려','주세','문의'], ONE = '가이은는을를에도좀요곳뭐왜것거';
function faq(items, q){
  var rows = items;
  if (q.length >= 2) {
    var g = grams(q), ks = Object.keys(g).filter(function(k){ return k.length > 1 && STOP.indexOf(k) < 0; }), os = Object.keys(g).filter(function(k){ return k.length === 1 && ONE.indexOf(k) < 0; });
    var n0 = Math.max(1, ks.length + os.length);
    rows = items.map(function(it){ var gq = grams(it.q), ga = grams(it.a);
      var s = ks.reduce(function(n, k){ return n + (gq[k] ? 3 : ga[k] ? 1 : 0); }, 0) + os.reduce(function(n, k){ return n + (it.q.indexOf(k) >= 0 ? 3 : it.a.indexOf(k) >= 0 ? 1 : 0); }, 0);
      return { it: it, s: s / n0 }; }).filter(function(x){ return x.s >= 0.5; }).sort(function(a, b){ return b.s - a.s; }).map(function(x){ return x.it; });
  }
  var box = $('faq');
  box.innerHTML = rows.length ? rows.map(function(it, i){ return '<details' + (q && i === 0 ? ' open' : '') + '><summary>' + esc(it.q) + '</summary><div class="ans pre-wrap">' + esc(it.a) + '</div>' + (risky(it.a) ? '<div class="warn" style="margin:0 12px 12px">' + WARN + '</div>' : '') + '</details>'; }).join('')
    : '<p>「' + esc(q) + '」에 맞는 답이 없어요. 아래에서 사장님께 물어보세요.</p>';
}
async function loadThread(prefer){
  var ts = [];
  try { ts = (await rpc('dg_guest_threads', { p_token: token() })).filter(function(t){ return t.code === D.code; }); } catch (e) {}
  TH = ts.filter(function(t){ return t.id === prefer; })[0] || ts.filter(function(t){ return t.status !== 'closed'; })[0] || null;
  var box = $('thread');
  if (!TH) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="card"><b class="h">📮 사장님과 나눈 이야기</b><div class="msgs">' + TH.msgs.map(function(m){
    return '<div class="m ' + (m.o ? 'o' : 'me') + '"><small>' + (m.o ? '🧑‍🍳 사장님' : '나') + ' · ' + when(m.t) + '</small><div class="pre-wrap">' + esc(m.b) + '</div>' +
      (m.o && risky(m.b) ? '<div class="warn" style="margin-top:6px">' + WARN + '</div>' : '') + '</div>';
  }).join('') + '</div>' + (TH.status === 'open' ? '<p>사장님이 확인하면 여기에 답이 보여요.</p>' : '') + '<div id="gpush"></div></div>';
  $('askCard').querySelector('b').textContent = '💬 이어서 묻기';
  gpushBox();
  if (TH.unread) rpc('dg_guest_seen', { p_token: token(), p_thread: TH.id }).catch(function(){});
  if (!poll) poll = setInterval(function(){ if (!document.hidden) loadThread(TH && TH.id); }, 15000);
}
/* 🔔 2026-11-15 단골창구 앱 안에서만 — 「사장님 답장 오면 알림 받기」 (11_dangol_guest_push.sql)
   손님은 가입이 없으므로, 이 휴대폰의 손님 열쇠(dangol_token)와 알림 주소를 짝지어 둡니다. 웹 브라우저에서는 보이지 않습니다. */
/* ⚠ 단골창구 앱에서만 — 부름 · 바로너 앱은 알림 서버(파이어베이스)가 달라 이 길로 보내면 닿지 않습니다 */
function isDangolApp(){ try { return window.ALIAS_APP === 'dangol' || !!(window.AliasNative && AliasNative.appKind && AliasNative.appKind() === 'dangol'); } catch (e) { return false; } }
function PN(){ try { return isDangolApp() && window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform() && Capacitor.Plugins && Capacitor.Plugins.PushNotifications; } catch (e) { return null; } }
function pushToken(P){
  return new Promise(function(res, rej){
    var done = false, t = setTimeout(function(){ if (!done) { done = true; rej(new Error('timeout')); } }, 15000);
    P.addListener('registration', function(x){ if (!done) { done = true; clearTimeout(t); res(x.value); } });
    P.addListener('registrationError', function(e){ if (!done) { done = true; clearTimeout(t); rej(new Error(JSON.stringify(e))); } });
    P.register();
  });
}
async function gpushSync(ask){
  var P = PN(); if (!P) return false;
  var perm = await P.checkPermissions();
  if (perm.receive !== 'granted') { if (!ask) return false; perm = await P.requestPermissions(); if (perm.receive !== 'granted') { toast('휴대폰 설정에서 단골창구 알림을 허용해 주세요.'); return false; } }
  var tk = await pushToken(P);
  var r = await rpc('dg_guest_push_set', { p_token: token(), p_push: tk, p_platform: (Capacitor.getPlatform && Capacitor.getPlatform()) || '' });
  if (r && r.ok) { store('dangol_gpush', String(Date.now())); return true; }
  return false;
}
async function gpushBox(){
  var bx = $('gpush'); if (!bx || !PN()) return;
  var last = Number(store('dangol_gpush') || 0);
  if (last) { bx.innerHTML = '<p style="font-size:13px">🔔 사장님이 답장하면 알림이 와요.</p>'; if (Date.now() - last > 86400e3) gpushSync(false).catch(function(){}); return; }
  bx.innerHTML = '<button class="btn" id="gpGo" type="button" style="background:var(--coral,#E8734A)">🔔 사장님 답장 오면 알림 받기</button>';
  $('gpGo').onclick = async function(){ this.disabled = true; try { if (await gpushSync(true)) { toast('알림을 켰어요. 🔔'); gpushBox(); return; } } catch (e) { toast('알림을 켜지 못했어요. 잠시 뒤 다시 눌러 주세요.'); } this.disabled = false; };
}
/* 알림을 눌러 들어오면 그 가게 화면으로 */
(function(){ var P = PN(); if (!P || window.__dgTap) return; window.__dgTap = true;
  P.addListener('pushNotificationActionPerformed', function(a){ var d = (a && a.notification && a.notification.data) || {}; if (d.url) location.href = d.url; }); })();

async function send(){
  var b = $('body').value.trim(), nm = $('nm').value.trim(), btn = $('send');
  if (!b) { toast('물어볼 내용을 적어 주세요.'); return; }

    if (nm) store('dangol_name', nm);

    if (!r || !r.ok) throw r;
    fetch(URL0 + '/functions/v1/dangol-notify', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY0, Authorization: 'Bearer ' + KEY0 },
      body: JSON.stringify({ thread: r.thread, token: token() }) }).catch(function(){});
    $('body').value = ''; toast('보냈어요. 사장님이 답하면 이 화면에 보여요.');
    await loadThread(r.thread);

  } catch (e) { toast(errMsg(e)); }
  btn.disabled = false; btn.textContent = '보내기';
}
function report(){
  var reasons = ['가짜 가게 같아요', '돈 · 계좌를 먼저 요구해요', '욕설 · 불쾌한 답장', '기타'];

    reasons.map(function(r, i){ return '<label style="display:flex;gap:8px;align-items:center;font-weight:700"><input type="radio" name="rr" value="' + i + '" style="width:auto"' + (i === 0 ? ' checked' : '') + '>' + r + '</label>'; }).join('') +
    '<textarea id="rnote" maxlength="500" placeholder="자세한 내용 (선택)" style="min-height:70px"></textarea><div class="row"><button class="btn" id="rgo" type="button">신고 보내기</button><button class="btn g" id="rcx" type="button">닫기</button></div>';
  $('report').parentNode.replaceWith(box);

    try { var i = Number(box.querySelector('input[name=rr]:checked').value); var r = await rpc('dg_report', { p_code: D.code, p_token: token(), p_reason: reasons[i], p_note: box.querySelector('#rnote').value.trim() || null });
      if (!r.ok) throw r; box.innerHTML = '<b class="h">✅ 신고를 받았어요</b><p>고맙습니다. 확인한 뒤 조치하겠습니다. 급한 피해가 있으면 112에 신고하세요.</p>'; }
    catch (e) { toast(errMsg(e)); this.disabled = false; }

}
